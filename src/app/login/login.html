<div class="login-page">

    <div class="login-card">

        <h1>Welcome Back</h1>
        <p>Login to your Car Store account</p>

        <form (ngSubmit)="login()">

        <div class="form-group">
            <label for="email">Email</label>

            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input type="password" id="password"  name="password" [(ngModel)]="password" placeholder="Enter your password" required >
        </div>

        @if (errorMessage) {
            <div class="error-message">
            {{ errorMessage }}
            </div>
        }

        <button type="submit" class="login-btn">
            Login
        </button>

        </form>

        <p class="register-text">
        Don't have an account?

        <a routerLink="/register">
            Register
        </a>
        </p>
    </div>
</div>
